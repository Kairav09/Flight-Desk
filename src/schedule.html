<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Schedules – FlightDesk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="dashboard.css" />
  <style>
    /* ── Schedule-specific styles ─────────────────────────────────────── */

    .schedule-layout {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* ── Heatmap Card ───────────────────────────────────────────────── */
    .heatmap-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px 28px;
    }

    .heatmap-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .heatmap-header h2 {
      font-family: var(--font-h);
      font-size: 1rem;
      font-weight: 700;
    }

    .heatmap-nav {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .heatmap-month {
      font-family: var(--font-h);
      font-size: .9rem;
      font-weight: 700;
      min-width: 130px;
      text-align: center;
    }

    .heatmap-nav-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--muted);
      cursor: pointer;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .2s;
    }

    .heatmap-nav-btn:hover {
      color: var(--text);
      border-color: var(--cyan);
    }

    .heatmap-legend {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: .72rem;
      color: var(--muted);
    }

    .legend-cells {
      display: flex;
      gap: 4px;
    }

    .legend-cell {
      width: 14px;
      height: 14px;
      border-radius: 3px;
    }

    /* Calendar grid */
    .heatmap-calendar {
      width: 100%;
      border-collapse: separate;
      border-spacing: 5px;
    }

    .heatmap-calendar th {
      font-family: var(--font-h);
      font-size: .72rem;
      font-weight: 600;
      color: var(--muted);
      text-align: center;
      padding-bottom: 6px;
      letter-spacing: .06em;
    }

    .heatmap-calendar td {
      width: calc(100% / 7);
      height: 52px;
      border-radius: 8px;
      cursor: pointer;
      position: relative;
      vertical-align: top;
      padding: 6px 8px;
      transition: transform .15s, box-shadow .15s;
    }

    .heatmap-calendar td:hover:not(.empty-cell) {
      transform: scale(1.06);
      z-index: 5;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }

    .heatmap-calendar td.empty-cell {
      cursor: default;
      background: transparent !important;
    }

    .heatmap-calendar td.selected-cell {
      outline: 2px solid var(--cyan);
      outline-offset: 1px;
    }

    .heatmap-calendar td.today-cell {
      outline: 2px solid rgba(255, 255, 255, 0.35);
      outline-offset: 1px;
    }

    .heatmap-calendar td.today-cell.selected-cell {
      outline: 2px solid var(--cyan);
    }

    .cell-day-num {
      font-family: var(--font-h);
      font-size: .78rem;
      font-weight: 600;
      line-height: 1;
      display: block;
    }

    .cell-flight-count {
      font-size: .65rem;
      color: rgba(255, 255, 255, 0.5);
      display: block;
      margin-top: 3px;
    }

    td.heat-4 .cell-flight-count,
    td.heat-5 .cell-flight-count {
      color: rgba(0, 0, 0, 0.5);
    }

    td.heat-4 .cell-day-num,
    td.heat-5 .cell-day-num {
      color: rgba(0, 0, 0, 0.8);
    }

    /* Heat levels */
    .heat-0 {
      background: var(--surface2);
    }

    .heat-1 {
      background: rgba(245, 158, 11, 0.18);
    }

    .heat-2 {
      background: rgba(245, 158, 11, 0.36);
    }

    .heat-3 {
      background: rgba(245, 158, 11, 0.56);
    }

    .heat-4 {
      background: rgba(245, 158, 11, 0.78);
    }

    .heat-5 {
      background: rgba(245, 158, 11, 0.96);
    }

    /* Tooltip */
    .cell-tooltip {
      position: fixed;
      z-index: 100;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: .75rem;
      pointer-events: none;
      display: none;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      white-space: nowrap;
    }

    .cell-tooltip .tt-date {
      font-family: var(--font-h);
      font-weight: 700;
      margin-bottom: 2px;
    }

    .cell-tooltip .tt-count {
      color: var(--cyan);
      font-weight: 600;
    }

    /* ── Timeline Card ──────────────────────────────────────────────── */
    .timeline-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .timeline-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 12px;
    }

    .timeline-header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .timeline-header h2 {
      font-family: var(--font-h);
      font-size: 1rem;
      font-weight: 700;
    }

    .selected-date-badge {
      background: var(--cyan-dim);
      border: 1px solid rgba(245, 158, 11, 0.25);
      border-radius: 100px;
      padding: 4px 12px;
      font-size: .75rem;
      font-weight: 600;
      color: var(--cyan);
      font-family: var(--font-h);
    }

    .timeline-summary {
      display: flex;
      gap: 16px;
      font-size: .78rem;
    }

    .tl-stat {
      display: flex;
      align-items: center;
      gap: 5px;
      color: var(--muted);
    }

    .tl-stat strong {
      color: var(--text);
      font-family: var(--font-h);
    }

    .timeline-body {
      padding: 0 24px 24px;
    }

    .timeline-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 60px 24px;
      color: var(--muted);
      text-align: center;
    }

    .timeline-empty p {
      font-size: .9rem;
    }

    .timeline-empty span {
      font-size: .8rem;
    }

    /* Hour block */
    .hour-block {
      margin-top: 24px;
    }

    .hour-label {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }

    .hour-label span {
      font-family: var(--font-h);
      font-size: .75rem;
      font-weight: 700;
      color: var(--cyan);
      letter-spacing: .06em;
      white-space: nowrap;
    }

    .hour-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* Flight card in timeline */
    .tl-flight-card {
      display: grid;
      grid-template-columns: 90px 1fr 80px 100px 120px;
      align-items: center;
      gap: 16px;
      padding: 14px 18px;
      border-radius: 10px;
      background: var(--surface2);
      border: 1px solid var(--border);
      margin-bottom: 8px;
      cursor: pointer;
      transition: border-color .2s, transform .15s, background .2s;
      animation: cardIn .3s ease both;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .tl-flight-card:hover {
      border-color: rgba(245, 158, 11, 0.25);
      background: var(--surface3);
      transform: translateX(4px);
    }

    .tl-flight-no {
      font-family: var(--font-h);
      font-weight: 800;
      font-size: .95rem;
    }

    .tl-route {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .tl-dest {
      font-weight: 600;
      font-size: .9rem;
    }

    .tl-airline {
      font-size: .75rem;
      color: var(--muted);
    }

    .tl-time {
      font-family: var(--font-h);
      font-size: .9rem;
      font-weight: 600;
      color: var(--text);
    }

    .tl-gate {
      font-family: var(--font-h);
      font-weight: 700;
      font-size: .85rem;
      color: var(--cyan);
    }

    /* Responsive */
    @media (max-width: 768px) {
      .tl-flight-card {
        grid-template-columns: 70px 1fr 70px;
      }

      .tl-flight-card .tl-gate,
      .tl-flight-card .status-badge {
        display: none;
      }

      .heatmap-card {
        padding: 18px 16px;
      }
    }
  </style>
</head>

  <script>
    // ── Auth guard ─────────────────────────────────────────────────────
    if (!localStorage.getItem('fd_isLoggedIn')) window.location.href = 'index.html';

    // ── User info ──────────────────────────────────────────────────────
    const fullname = localStorage.getItem('fd_fullname') || 'User';
    const initials = fullname.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
    document.getElementById('userAvatar').textContent = initials;
    document.getElementById('userName').textContent = fullname;

    // ── Clock ──────────────────────────────────────────────────────────
    function updateClock() {
      const now = new Date();
      const el = document.getElementById('headerClock');
      if (el) el.textContent = now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
    }
    updateClock(); setInterval(updateClock, 1000);

    // ── Logout ─────────────────────────────────────────────────────────
    document.getElementById('logoutBtn').addEventListener('click', e => {
      e.preventDefault(); localStorage.removeItem('fd_isLoggedIn'); window.location.href = 'index.html';
    });

    // ── Navbar scroll ──────────────────────────────────────────────────
    window.addEventListener('scroll', () => document.getElementById('topnav').classList.toggle('scrolled', window.scrollY > 10));

    // ── User dropdown ──────────────────────────────────────────────────
    document.getElementById('userAvatarBtn').addEventListener('click', () => {
      document.getElementById('userDropdown').classList.toggle('open');
    });
    document.addEventListener('click', e => {
      if (!document.getElementById('userMenu').contains(e.target))
        document.getElementById('userDropdown').classList.remove('open');
    });

    // ── Mobile menu ────────────────────────────────────────────────────
    document.getElementById('mobileMenuBtn').addEventListener('click', () => {
      document.getElementById('mobileNav').classList.toggle('open');
    });

    // ── Flight data ────────────────────────────────────────────────────
    // Generate realistic flight data spread across the current month ± 1 month
    const today = new Date();
    today.setHours(0, 0, 0, 0);

    const airlines = ['IndiGo', 'Air India', 'SpiceJet', 'Vistara', 'Akasa Air', 'GoFirst'];
    const codes = ['6E', 'AI', 'SG', 'UK', 'QP', 'G8'];
    const dests = ['Mumbai', 'Delhi', 'Bangalore', 'Hyderabad', 'Chennai', 'Kolkata', 'Pune', 'Goa', 'Jaipur', 'Ahmedabad', 'Srinagar', 'Kochi', 'Amritsar', 'Nagpur', 'Varanasi'];
    const statuses = ['on-time', 'on-time', 'on-time', 'delayed', 'boarding', 'landed', 'cancelled'];
    const gates = ['A2', 'A5', 'A9', 'A11', 'B4', 'B8', 'B12', 'C2', 'C7', 'C9', 'D1', 'D6', 'D17', 'D21', 'D22'];
    const aircrafts = ['Airbus A320', 'Boeing 737', 'Airbus A321', 'Boeing 787'];

    function randomItem(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
    function seededRand(seed) {
      let s = seed;
      return function () {
        s = (s * 9301 + 49297) % 233280;
        return s / 233280;
      };
    }

    // Build a map of date string → array of flights
    const flightsByDate = {};

    // Generate data for 3 months around today
    const startDate = new Date(today.getFullYear(), today.getMonth() - 1, 1);
    const endDate = new Date(today.getFullYear(), today.getMonth() + 2, 0);

    for (let d = new Date(startDate); d <= endDate; d.setDate(d.getDate() + 1)) {
      const key = d.toISOString().split('T')[0];
      const rand = seededRand(d.getTime() / 86400000 | 0);
      const count = Math.floor(rand() * 18) + 2; // 2–19 flights per day
      const flights = [];
      for (let i = 0; i < count; i++) {
        const r = seededRand((d.getTime() / 86400000 | 0) * 100 + i);
        const aIdx = Math.floor(r() * airlines.length);
        const hour = Math.floor(r() * 18) + 5; // 05:00–22:00
        const minute = Math.floor(r() * 4) * 15;
        const time = `${String(hour).padStart(2, '0')}:${String(minute).padStart(2, '0')}`;
        const status = statuses[Math.floor(r() * statuses.length)];
        const delayMin = status === 'delayed' ? (Math.floor(r() * 8) + 1) * 5 : 0;
        let estH = hour, estM = minute + delayMin;
        if (estM >= 60) { estH++; estM -= 60; }
        const est = `${String(estH).padStart(2, '0')}:${String(estM).padStart(2, '0')}`;
        flights.push({
          id: `${key}-${i}`,
          no: `${codes[aIdx]}${Math.floor(r() * 9000) + 1000}`,
          airline: airlines[aIdx],
          dest: dests[Math.floor(r() * dests.length)],
          gate: gates[Math.floor(r() * gates.length)],
          sched: time,
          est,
          status,
          aircraft: aircrafts[Math.floor(r() * aircrafts.length)],
        });
      }
      flights.sort((a, b) => a.sched.localeCompare(b.sched));
      flightsByDate[key] = flights;
    }

    // ── Heatmap state ──────────────────────────────────────────────────
    let viewYear = today.getFullYear();
    let viewMonth = today.getMonth();
    let selectedKey = today.toISOString().split('T')[0];

    function getHeatLevel(count) {
      if (!count || count === 0) return 0;
      if (count <= 3) return 1;
      if (count <= 6) return 2;
      if (count <= 10) return 3;
      if (count <= 15) return 4;
      return 5;
    }

    const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
    const tooltip = document.getElementById('cellTooltip');

    function renderHeatmap() {
      document.getElementById('heatmapMonth').textContent = `${MONTHS[viewMonth]} ${viewYear}`;
      const grid = document.getElementById('heatmapGrid');

      const firstDay = new Date(viewYear, viewMonth, 1).getDay();
      const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
      const todayKey = today.toISOString().split('T')[0];

      let html = `<table class="heatmap-calendar">
        <thead><tr>
          <th>Sun</th><th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th><th>Sat</th>
        </tr></thead><tbody><tr>`;

      // Empty cells before first day
      for (let i = 0; i < firstDay; i++) {
        html += `<td class="empty-cell heat-0"></td>`;
      }

      let dayOfWeek = firstDay;
      for (let day = 1; day <= daysInMonth; day++) {
        const d = new Date(viewYear, viewMonth, day);
        const key = d.toISOString().split('T')[0];
        const count = (flightsByDate[key] || []).length;
        const level = getHeatLevel(count);
        const isToday = key === todayKey;
        const isSelected = key === selectedKey;

        let cls = `heat-${level}`;
        if (isToday) cls += ' today-cell';
        if (isSelected) cls += ' selected-cell';

        html += `<td class="${cls}" data-key="${key}" data-count="${count}">
          <span class="cell-day-num">${day}</span>
          ${count > 0 ? `<span class="cell-flight-count">${count} flights</span>` : ''}
        </td>`;

        dayOfWeek++;
        if (dayOfWeek === 7 && day < daysInMonth) {
          html += `</tr><tr>`;
          dayOfWeek = 0;
        }
      }

      // Fill remaining cells
      while (dayOfWeek < 7 && dayOfWeek > 0) {
        html += `<td class="empty-cell heat-0"></td>`;
        dayOfWeek++;
      }

      html += `</tr></tbody></table>`;
      grid.innerHTML = html;

      // Attach events
      grid.querySelectorAll('td:not(.empty-cell)').forEach(td => {
        const key = td.dataset.key;
        const count = parseInt(td.dataset.count);
        const d = new Date(key + 'T00:00:00');

        td.addEventListener('mouseenter', e => {
          document.getElementById('ttDate').textContent =
            d.toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
          document.getElementById('ttCount').textContent = `${count} flight${count !== 1 ? 's' : ''}`;
          tooltip.style.display = 'block';
        });
        td.addEventListener('mousemove', e => {
          tooltip.style.left = (e.clientX + 14) + 'px';
          tooltip.style.top = (e.clientY - 50) + 'px';
        });
        td.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; });
        td.addEventListener('click', () => {
          selectedKey = key;
          tooltip.style.display = 'none';
          renderHeatmap();
          renderTimeline();
        });
      });
    }

    // ── Timeline ───────────────────────────────────────────────────────
    function getStatusLabel(s) {
      return { 'on-time': 'On Time', 'delayed': 'Delayed', 'boarding': 'Boarding', 'cancelled': 'Cancelled', 'landed': 'Landed' }[s] || s;
    }

    function renderTimeline() {
      const flights = flightsByDate[selectedKey] || [];
      const d = new Date(selectedKey + 'T00:00:00');
      const isToday = selectedKey === today.toISOString().split('T')[0];
      const dateStr = isToday ? 'Today' : d.toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });

      document.getElementById('selectedDateBadge').textContent = dateStr;

      // Summary
      const onTime = flights.filter(f => f.status === 'on-time').length;
      const delayed = flights.filter(f => f.status === 'delayed').length;
      const cancelled = flights.filter(f => f.status === 'cancelled').length;
      document.getElementById('timelineSummary').innerHTML = `
        <div class="tl-stat"><strong>${flights.length}</strong> flights</div>
        <div class="tl-stat" style="color:#00d264"><strong>${onTime}</strong> on time</div>
        <div class="tl-stat" style="color:#ffaa00"><strong>${delayed}</strong> delayed</div>
        <div class="tl-stat" style="color:#ff4444"><strong>${cancelled}</strong> cancelled</div>
      `;

      const body = document.getElementById('timelineBody');
      if (flights.length === 0) {
        body.innerHTML = `
          <div class="timeline-empty">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.3">
              <rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>
            </svg>
            <p>No flights scheduled</p>
            <span>Try selecting a different date on the heatmap</span>
          </div>`;
        return;
      }

      // Group by hour
      const byHour = {};
      flights.forEach(f => {
        const h = f.sched.split(':')[0];
        if (!byHour[h]) byHour[h] = [];
        byHour[h].push(f);
      });

      body.innerHTML = Object.keys(byHour).sort().map((h, i) => `
        <div class="hour-block" style="animation-delay:${i * 0.05}s">
          <div class="hour-label">
            <span>${h}:00 – ${String(parseInt(h) + 1).padStart(2, '0')}:00</span>
          </div>
          ${byHour[h].map((f, j) => `
            <div class="tl-flight-card" style="animation-delay:${(i * 0.05 + j * 0.03)}s">
              <div class="tl-flight-no">${f.no}</div>
              <div class="tl-route">
                <div class="tl-dest">${f.dest}</div>
                <div class="tl-airline">${f.airline}</div>
              </div>
              <div class="tl-time">${f.sched}</div>
              <div class="tl-gate">${f.gate}</div>
              <span class="status-badge ${f.status}">${getStatusLabel(f.status)}</span>
            </div>
          `).join('')}
        </div>
      `).join('');
    }

    // ── Month navigation ───────────────────────────────────────────────
    document.getElementById('prevMonth').addEventListener('click', () => {
      viewMonth--;
      if (viewMonth < 0) { viewMonth = 11; viewYear--; }
      renderHeatmap();
    });
    document.getElementById('nextMonth').addEventListener('click', () => {
      viewMonth++;
      if (viewMonth > 11) { viewMonth = 0; viewYear++; }
      renderHeatmap();
    });

    // ── Init ───────────────────────────────────────────────────────────
    renderHeatmap();
    renderTimeline();
  </script>
</body>

</html>
